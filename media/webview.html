<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Developer</title>
    <link rel="stylesheet" href="${webviewCss}">
    <link rel="stylesheet" href="${codiconCss}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1>
                    <span class="codicon codicon-file-text"></span>
                    AI Content Developer
                </h1>
                <button id="refresh-btn" class="icon-button" title="Refresh">
                    <span class="codicon codicon-refresh"></span>
                </button>
            </div>
            <p class="subtitle">Create professional technical documentation using Copilot</p>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Input Sources Section -->
            <section class="input-section">
                <h2>Input Sources</h2>
                
                <!-- Input Buttons -->
                <div class="input-buttons">
                    <button id="select-files-btn" class="input-button">
                        <span class="codicon codicon-file"></span>
                        Select Files
                    </button>
                    <button id="add-url-btn" class="input-button">
                        <span class="codicon codicon-globe"></span>
                        Add URL
                    </button>
                    <button id="add-github-btn" class="input-button">
                        <span class="codicon codicon-github"></span>
                        Add GitHub PR
                    </button>
                </div>

                <!-- URL Input (hidden by default) -->
                <div id="url-input-container" class="input-container hidden">
                    <div class="input-row">
                        <input 
                            type="url" 
                            id="url-input" 
                            placeholder="https://example.com/documentation"
                            class="text-input"
                        />
                        <button id="add-url-confirm" class="confirm-button">
                            <span class="codicon codicon-check"></span>
                        </button>
                    </div>
                </div>

                <!-- GitHub Input (hidden by default) -->
                <div id="github-input-container" class="input-container hidden">
                    <div class="input-row">
                        <input 
                            type="text" 
                            id="github-input" 
                            placeholder="owner/repo/pull/123 or full GitHub URL"
                            class="text-input"
                        />
                        <button id="add-github-confirm" class="confirm-button">
                            <span class="codicon codicon-check"></span>
                        </button>
                    </div>
                </div>

                <!-- Input List -->
                <div class="input-list-container">
                    <h3>Selected Inputs</h3>
                    <div id="input-list" class="input-list">
                        <div class="empty-state">No inputs added yet</div>
                    </div>
                </div>
            </section>

            <!-- Content Request Section -->
            <section class="content-section">
                <h2>Content Goal</h2>
                <div class="input-group">
                    <label for="content-goal">What documentation do you want to create?</label>
                    <textarea 
                        id="content-goal" 
                        class="content-goal-input" 
                        placeholder="e.g., Create comprehensive API documentation for the authentication module including examples and error handling..."
                        rows="4"
                    ></textarea>
                </div>

                <!-- Execution Mode -->
                <div class="execution-mode">
                    <label class="checkbox-label">
                        <input type="checkbox" id="interactive-mode" />
                        <span>Interactive Mode</span>
                    </label>
                    <p class="mode-description">
                        Pause between each prompt step for review and modification
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button id="execute-btn" class="primary-button" disabled>
                        <span class="codicon codicon-play"></span>
                        Execute Workflow
                    </button>
                    <button id="clear-btn" class="secondary-button">
                        <span class="codicon codicon-clear-all"></span>
                        Clear All
                    </button>
                </div>
            </section>

            <!-- Workflow Status Section -->
            <section id="workflow-status" class="status-section hidden">
                <h3>Workflow Progress</h3>
                <div class="status-container">
                    <div id="current-step" class="current-step hidden"></div>
                    <div id="status-text" class="status-text"></div>
                    <div class="progress-indicator">
                        <span class="codicon codicon-loading codicon-modifier-spin"></span>
                    </div>
                </div>
            </section>

            <!-- Response Section -->
            <section id="response-section" class="response-section hidden">
                <h3>Result</h3>
                <div id="response-content" class="response-content"></div>
            </section>
        </main>
    </div>

    <script src="${webviewJs}"></script>
</body>
</html>
